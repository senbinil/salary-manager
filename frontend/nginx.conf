server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Everything Vite emits under /assets carries a content hash, so it can be cached
    # indefinitely. `add_header` rather than `expires`, which would emit a second
    # Cache-Control header.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it names the current asset hashes, so a stale
    # copy would keep serving the previous deploy's bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (/dashboard, and the catch-all 404) are not files on disk, so
    # unknown paths fall back to the SPA entry point. The backend health check hits
    # this too, which is why / has to answer 200.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
