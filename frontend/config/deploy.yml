# Name of your application. Used to uniquely configure containers.
service: frontend

# Name of the container image (use your-user/app-name on external registries).
image: <%= ENV.fetch("DOCKERHUB_USER") %>/salary-manager-frontend

# Deploy to these servers.
servers:
  web:
    - <%= ENV.fetch("DEPLOY_HOST") %>

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Kamal's proxy already serves the API on this host, so this app just adds a second
# route to it. Both apps share the proxy and the `kamal` docker network.
proxy:
  ssl: true
  host: <%= ENV.fetch("SITE_HOST") %>
  # app_port is not set because it defaults to 80, which is where nginx listens.
  healthcheck:
    path: /

# Where you keep your container images. Docker Hub is the default, so `server` is
# unset and `image` above carries the `<user>/<repo>` name.
registry:
  username: <%= ENV.fetch("DOCKERHUB_USER") %>

  # Always use an access token rather than real password when possible.
  # The value comes from .env.production via .kamal/secrets.
  password:
    - KAMAL_REGISTRY_PASSWORD

# No env block: the SPA reads no runtime configuration. The API origin is baked into
# the bundle at build time by the builder arg below, and there are no secrets to inject.

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"

# Configure the image builder.
builder:
  arch: amd64

  # Build with the daemon's own BuildKit instead of the default `docker-container`
  # driver. On Docker Desktop for WSL2 the generated builder container cannot start
  # ("invalid mount config for type bind: bind source path does not exist:
  # /run/desktop/mnt/host/wsl/..."), so Kamal fails while booting its buildx builder,
  # before the first build instruction runs. The docker driver builds the same
  # context without a separate builder container.
  driver: docker

  # Vite inlines import.meta.env.VITE_API_URL at build time, so the API origin is a
  # build argument rather than a runtime variable: changing it needs a new image.
  args:
    VITE_API_URL: <%= ENV.fetch("API_URL") %>

# Use a different ssh user than root
# ssh:
#   user: app
ssh:
  user: root
  keys:
    - <%= ENV["KAMAL_SSH_KEY"] || "~/.ssh/id_rsa" %>
